<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>Image Gallery</h1>
    <p>A responsive grid built with CSS Grid</p>
  </header>

  <main class="gallery">
    <figure class="card">
      <img src="images/image1.svg" alt="Sunset over hills">
      <figcaption>Sunset</figcaption>
    </figure>
    <figure class="card">
      <img src="images/image2.svg" alt="Ocean waves">
      <figcaption>Ocean</figcaption>
    </figure>
    <figure class="card">
      <img src="images/image3.svg" alt="Green forest">
      <figcaption>Forest</figcaption>
    </figure>
    <figure class="card">
      <img src="images/image4.svg" alt="Purple night sky">
      <figcaption>Night Sky</figcaption>
    </figure>
    <figure class="card">
      <img src="images/image5.svg" alt="Desert dunes">
      <figcaption>Desert</figcaption>
    </figure>
    <figure class="card">
      <img src="images/image6.svg" alt="Snowy mountains">
      <figcaption>Mountains</figcaption>
    </figure>
    <figure class="card">
      <img src="images/image7.svg" alt="Pink blossoms">
      <figcaption>Blossoms</figcaption>
    </figure>
    <figure class="card">
      <img src="images/image8.svg" alt="Golden field">
      <figcaption>Golden Field</figcaption>
    </figure>
    <figure class="card">
      <img src="images/image9.svg" alt="Teal lake">
      <figcaption>Lake</figcaption>
    </figure>
  </main>
</body>
</html>
