<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Task Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>Task Tracker</h1>

    <!-- Add task -->
    <form id="taskForm" class="task-form">
      <input type="text" id="taskInput" placeholder="Add a new task..." autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <!-- Counts -->
    <div class="stats">
      <span>Total: <strong id="totalCount">0</strong></span>
      <span>Completed: <strong id="completedCount">0</strong></span>
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <!-- Task list -->
    <ul id="taskList" class="task-list"></ul>
    <p id="emptyMessage" class="empty">No tasks to show.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
