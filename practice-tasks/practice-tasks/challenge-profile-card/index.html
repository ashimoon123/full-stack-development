
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Professional Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="profile-card">
    <div class="card-top">
      <span class="status">
        <span class="status-dot"></span>
        Available to learn
      </span>
    </div>

    <!-- Profile Picture -->
    <div class="avatar-wrapper">
      <img id="profilePic" alt="Profile picture">
      <div id="avatarLetter" class="avatar-letter">A</div>

      <label for="photoInput" class="camera-btn" title="Upload profile picture">
        📷
      </label>

      <input
        type="file"
        id="photoInput"
        accept="image/*"
        hidden
      >
    </div>

    <p class="photo-hint">Click the camera to change photo</p>

    <h1>Ayesha Bibi</h1>
    <p class="role">Aspiring Full-Stack Developer</p>

    <div class="divider"></div>

    <!-- Bio Display -->
    <p id="bio">
      Hi! I am a student passionate about web development,
      learning HTML, CSS, JavaScript, and React.
    </p>

    <!-- Manual Bio Editor -->
    <div class="bio-editor">
      <label for="bioInput">Edit your bio</label>

      <textarea
        id="bioInput"
        rows="4"
        maxlength="500"
        placeholder="Write your new bio here..."
      ></textarea>

      <div class="char-count">
        <span id="charCount">0</span>/500 characters
      </div>

      <button id="saveBioBtn" type="button">
        Save Bio
      </button>

      <button id="changeBioBtn" class="secondary-btn" type="button">
        Try Sample Bio
      </button>

      <p id="message" role="status" aria-live="polite"></p>
    </div>

    <div class="skills">
      <span>HTML</span>
      <span>CSS</span>
      <span>JavaScript</span>
      <span>React</span>
    </div>

    <p class="footer">Designed with care <span>♥</span></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
